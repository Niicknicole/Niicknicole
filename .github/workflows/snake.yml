name: Generate Snake Animation

on:
  # Roda automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Permite rodar manualmente a partir da aba Actions
  workflow_dispatch:
  # Roda ao fazer push na branch principal (main ou master)
  push:
    branches:
      - main # Mantenha 'main' se for sua branch principal. Se for 'master', troque aqui.

jobs:
  generate:
    # Garante permissão de escrita para o Action criar a branch 'output'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          # Usa o nome de usuário do repositório
          github_user_name: ${{ Niicknicole }}
          # Gera o SVG em dist/snake.svg, usando o tema escuro do GitHub
          outputs: dist/snake.svg?palette=github-dark

      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output # Onde o arquivo final será salvo
          build_dir: dist       # Pasta onde o snake.svg foi gerado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
